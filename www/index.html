<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#123a2c}
body{margin:0;overscroll-behavior:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Slozzy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one screen, portrait. Top half is the jungle scene, bottom half the clock dial. Single visual world by choice. */
:root{
  --leaf-deep:#123a2c; --leaf:#1d5a43; --leaf-light:#2f8f5f;
  --cream:#fff5d9; --ink:#1c2a22; --sun:#ffc24a; --danger:#e8503a; --fur:#8a6a4a;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--leaf-deep);color:var(--cream);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.game{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--leaf-deep)}
.scene{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;border-radius:0 0 28px 28px;background:var(--leaf)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:var(--ink)}
.score{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hud .score{display:none}
.hud{justify-content:flex-end}
.cscore{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;color:var(--cream)}
.cmult{font-size:16px;background:var(--sun);color:var(--ink);border-radius:999px;padding:3px 9px}
.cmult.fever{box-shadow:0 0 14px 4px rgba(255,214,90,.85)}
.center .chip{font-size:12px}
.mult{font-size:22px;background:var(--sun);border-radius:999px;padding:2px 10px;vertical-align:middle}
.meta{text-align:right;font-weight:700;font-size:15px;line-height:1.25}
.meta small{display:block;font-weight:500;font-size:13px;opacity:.75}
.snd{position:absolute;left:12px;bottom:12px;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;z-index:2;
  background:var(--cream);color:var(--ink);font:800 20px var(--display)}
.snd.off{opacity:.5;text-decoration:line-through}
.snd:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.scene.dark .hud{color:var(--cream)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:16px;text-align:center;background:rgba(18,58,44,.82);color:var(--cream)}
.overlay h1{margin:0;font-size:44px;font-weight:800;line-height:1;color:var(--sun)}
.overlay p{margin:0;font-size:17px;font-weight:500;max-width:30ch;text-wrap:balance}
.overlay .big{font-size:22px;font-weight:700}
.overlay .stats{font-size:14px;opacity:.85;max-width:34ch}
.go{margin-top:8px;font:800 22px var(--display);color:var(--ink);background:var(--sun);border:0;border-radius:999px;
  padding:10px 34px;cursor:pointer;box-shadow:0 5px 0 #c98a1c}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a1c}
.go:focus-visible,.num:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.pad{position:relative;flex:1 1 50%;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
.dial{position:relative;border-radius:50%;background:var(--leaf);box-shadow:inset 0 0 0 6px var(--leaf-light)}
.num{position:absolute;left:50%;top:50%;border:0;border-radius:50%;background:var(--cream);color:var(--ink);
  font:800 22px var(--display);font-variant-numeric:tabular-nums;cursor:pointer;padding:0;
  box-shadow:0 4px 0 #cdbf95;will-change:transform}
.num.hit{background:var(--sun)}
.num.ok{background:#2fae6b;color:#fff;box-shadow:0 4px 0 #1d7a49}
.num.bad{background:var(--danger);color:#fff;box-shadow:0 4px 0 #a5321f}
.num.miss{background:var(--danger);color:var(--cream)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;text-align:center;pointer-events:none;
  display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:700;font-size:14px;line-height:1.15}
.wake{position:absolute;left:50%;top:50%;width:48%;height:48%;margin:-24% 0 0 -24%;border:0;border-radius:50%;cursor:pointer;
  font:800 17px var(--display);color:var(--ink);--p:0%;
  background:radial-gradient(circle,var(--sun) 0 60%,transparent 61%),conic-gradient(#2fae6b var(--p),var(--cream) 0)}
.wake:active{transform:scale(.94)}
.wake:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.overlay.start{justify-content:flex-start;padding-top:52px;padding-bottom:6px;gap:4px;
  background:linear-gradient(rgba(18,58,44,.7),rgba(18,58,44,0) 30%,rgba(18,58,44,0) 64%,rgba(18,58,44,.85))}
.overlay.start h1{margin-bottom:auto;text-shadow:0 3px 0 rgba(18,58,44,.6)}
.overlay.start #ovText{display:none}
.overlay.helpmode>*:not(.help){display:none!important}
.overlay.helpmode{justify-content:flex-start;padding-top:10px;overflow-y:auto;background:rgba(18,58,44,.92)}
.help{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:34ch}
.scene .help canvas{position:static;inset:auto;display:block;width:160px;height:100px;flex:none;max-width:100%;border-radius:16px}
.help h2{margin:2px 0 0;font-size:24px;font-weight:800;color:var(--sun)}
.help p{font-size:14px;line-height:1.3}
.hrow{align-items:flex-start}
.hrow canvas{width:96px;height:60px;border-radius:10px;flex:none}
.hrow b{display:block;font-size:15px}
.hrow small{font-size:13px;line-height:1.3}
.reset{position:absolute;top:10px;left:12px;font:600 12px var(--display);color:var(--cream);opacity:.75;background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.menu{display:flex;gap:8px;margin-top:6px}
.menu button{font:700 15px var(--display);border:0;border-radius:999px;padding:6px 16px;background:var(--cream);color:var(--ink);cursor:pointer}
.panel{position:absolute;inset:0;z-index:3;background:var(--leaf-deep);display:flex;flex-direction:column;padding:10px 16px}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.panel h2{margin:0;font-size:22px;font-weight:800}
.panel .list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px;min-height:0}
.row{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--leaf);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.row>div{flex:1;min-width:0}
.row small{display:block;font-weight:500;opacity:.8;font-size:12px}
.row button,.panel header button{font:800 14px var(--display);border:0;border-radius:999px;padding:6px 14px;background:var(--sun);color:var(--ink);cursor:pointer;white-space:nowrap}
.row button[disabled]{opacity:.45;cursor:default}
.row button.on{background:#2fae6b;color:#fff;opacity:1}
.menu button:focus-visible,.panel button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.sub{font-size:12px;opacity:.75;margin:8px 0 0;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;border-radius:3px;background:var(--leaf-deep);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun)}
.done{color:#9fe8c0;font-weight:800}
.dial.gold .num{background:#ffd65a;box-shadow:0 4px 0 #c98a1c}
.dial.gold{box-shadow:inset 0 0 0 6px #f0a52a!important}
.fring{position:absolute;inset:-8px;border-radius:50%;pointer-events:none;--f:0%;
  background:conic-gradient(var(--sun) var(--f),rgba(255,245,217,.12) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
.fring.cool{background:conic-gradient(rgba(255,245,217,.3) var(--f),rgba(255,245,217,.07) 0)}
.fring.on{background:conic-gradient(#ffd65a var(--f),rgba(255,214,90,.18) 0);animation:fblink .5s steps(2) infinite;filter:drop-shadow(0 0 8px rgba(255,214,90,.95))}
@keyframes fblink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.fring.on{animation:none}}
.scene,.pad{transition:flex .6s ease,opacity .4s ease}
.game.crash .pad{flex:0 0 0px;opacity:0;padding:0;overflow:hidden}
.game.crash .scene{border-radius:0}
.chip{background:var(--leaf-deep);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.good{color:#9fe8c0}.chip.bad{color:#ffb3a3}
.hint{opacity:.7;font-weight:500}
/* Papier-Look für Uhr und Knöpfe */
.dial{background:radial-gradient(circle at 50% 45%,#2a6e52 0 55%,#1d5a43 56% 100%)}
.dial::before{content:"";position:absolute;inset:17%;border-radius:50%;border:2px dashed rgba(255,245,217,.16);pointer-events:none}
.num{background:radial-gradient(circle at 38% 30%,#fffaf0 0,#f6ebcd 55%,#e8d6a8 100%);border:2px solid rgba(140,110,60,.28);box-shadow:0 4px 0 #c4b083,0 8px 12px rgba(8,30,20,.35)}
.num.hit{background:radial-gradient(circle at 38% 30%,#ffe9a3,#ffc24a)}
.dial.gold .num{background:radial-gradient(circle at 38% 30%,#fff1b8,#ffd65a 60%,#f0b43a)}
.wake{box-shadow:0 6px 0 #c98a1c,0 12px 18px rgba(0,0,0,.35)}
.menu button{box-shadow:0 3px 0 #cdbf95}
.pad::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.08;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>

<div class="game" id="game">
  <div class="scene" id="scene">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="score"><span id="score">0</span> <span class="mult" id="mult" hidden>x1</span></div>
      <div class="meta"><span id="world">Wald</span><small>Rekord <span id="best">0</span></small><small>Lianen <span id="lianen">0</span></small><small>Mangos <span id="mango">0</span></small></div>
    </div>
    <button class="snd" id="snd" type="button" aria-label="Musik an oder aus">♪</button>
    <div class="overlay start" id="overlay">
      <h1 id="ovTitle">Slozzy</h1>
      <p class="big" id="ovBig" hidden></p>
      <p id="ovText">Tippe die Zahl, die vor Slozzy hängt, bevor der Ring abläuft. Ein Fehler beendet den Lauf.</p>
      <p class="stats" id="ovStats" hidden></p>
      <div class="help" id="help" hidden><canvas id="helpCv" width="480" height="300"></canvas><h2 id="helpT"></h2><p id="helpP"></p><button class="go" id="helpOk" type="button">Verstanden</button></div>
      <button class="reset" id="bReset" type="button">Fortschritt löschen (Test)</button>
      <button class="go" id="go" type="button">Los</button>
      <div class="menu"><button id="bShop" type="button">Shop</button><button id="bGoals" type="button">Tagesziele</button><button id="bHelp" type="button">Hilfe</button></div>
    </div>
  </div>
  <div class="pad" id="pad">
    <div class="panel" id="panel" hidden><header><h2 id="pTitle"></h2><span id="pMango"></span><button id="pClose" type="button">Zurück</button></header><div class="list" id="pList"></div></div>
    <div class="dial" id="dial"><div class="fring" id="fring"></div><div class="center" id="center"></div><button class="wake" id="wake" type="button" hidden>Aufwecken!</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
var WORLDS=[
 {name:"Wald",top:"#9fd6c2",bot:"#f3efc4",sun:"#fff6c9",far:"#8fc7a6",mid:"#4f9f7c",near:"#25705a",fg:"#0f3d33",saw:0},
 {name:"Wasser",top:"#7fc8e8",bot:"#d9f3ee",sun:"#ffffff",far:"#86c5d6",mid:"#3f93b0",near:"#1f6788",fg:"#0d3a55",saw:0},
 {name:"Vulkan",top:"#f08a6b",bot:"#ffd9a0",sun:"#ffe9a8",far:"#c96a5c",mid:"#8a3d48",near:"#52263a",fg:"#2a1424",saw:1},
 {name:"Strand",top:"#6fc3ee",bot:"#ffe7b8",sun:"#fff2a8",far:"#7fcfd0",mid:"#f0cf8e",near:"#dba85f",fg:"#7a4f2a",saw:0}
];
var WORLD_LEN=20;                    // Punkte pro Welt
var ITEMS={
 slow:{sym:"½",label:"Zeitlupe",dur:10,good:true,color:"#3fbf8f"},
 mh:{sym:"↔",label:"Spiegel ↔",dur:15,good:false,color:"#e8503a"},
 mv:{sym:"↕",label:"Spiegel ↕",dur:15,good:false,color:"#e8503a"},
 rot:{sym:"↻",label:"Drehung",dur:30,good:false,color:"#b05ad6"},
 shield:{sym:"★",label:"Schild",dur:0,good:true,color:"#2f8fd6"},
 fog:{sym:"?",label:"Nebel",dur:12,good:false,color:"#7a8791"},
 rom:{sym:"XII",label:"Römisch",dur:15,good:false,color:"#c2703a"},
 blank:{sym:"◌",label:"Lücken",dur:12,good:false,color:"#3a3350"}
};
var ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
var CHEERS=["Hurra!","Stark!","Wahnsinn!","Pura Vida!","Faultier-Legende!"];
var $=function(id){return document.getElementById(id)};
var cv=$("cv"),ctx=cv.getContext("2d"),scene=$("scene"),dial=$("dial"),pad=$("pad"),center=$("center");
var W=300,H=300,u=1,S=60,dialR=100,btn=50;
var btns=[],bpos=[];
var state="ready",nodes={},pos=0,score=0,camX=0,tLeft=0,tMax=1,theta=0,vel=0,handY=0;
var fx={slow:0,mh:0,mv:0,rot:0,fog:0,rom:0,blank:0},rotT=0,nextItem=6,lastN=0,time=0;
var SAY={slow:"Zeitlupe: mehr Zeit",shield:"Schild: 1 Fehler frei",mh:"Uhr gespiegelt ↔",mv:"Uhr gespiegelt ↕",rot:"Die Uhr dreht sich",fog:"Vorschau im Nebel",rom:"Römische Ziffern",blank:"4 Ziffern fehlen"};
var tut=true,bestMult=1,fastest=9;
try{tut=!localStorage.getItem("slozzy-tut")}catch(e){}
var hidden={},dist=0,mult=1,fastRun=0,shield=false,mango=0,floats=[],ac=null;
try{mango=parseInt(localStorage.getItem("slozzy-mango"),10)||0}catch(e){}
function tone(f,d,type,vol,slide){
  if(!ac)return;
  try{var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||"triangle";
    o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function vib(ms){try{
  var hp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
  if(hp){if(ms>100)hp.notification({type:"ERROR"});else hp.impact({style:ms>20?"MEDIUM":"LIGHT"})}
  else if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function floatUp(text,color){floats.push({text:text,color:color,t:1.1})}
function hud(){
  $("score").textContent=score;$("mango").textContent=mango;$("lianen").textContent=dist+(runBest?" / "+Math.max(runBest,dist):"");
  $("mult").textContent="x"+mult;$("mult").hidden=mult<2;
}
var world=0,prevWorld=0,fade=0,best=0;
try{best=parseInt(localStorage.getItem("slozzy-best"),10)||0}catch(e){}
$("best").textContent=best;

for(var n=1;n<=12;n++){(function(n){
  var b=document.createElement("button");b.type="button";b.className="num";b.id="num"+n;b.textContent=n;
  b.addEventListener("pointerdown",function(e){e.preventDefault();press(n,b)});
  b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();press(n,b)}});
  dial.appendChild(b);btns[n]=b;bpos[n]={x:0,y:0,init:false};
})(n)}

function resize(){
  var r=scene.getBoundingClientRect(),d=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
  u=Math.max(.7,Math.min(1.5,H/300));S=Math.min(110,W*.19);
  var p=pad.getBoundingClientRect(),D=Math.max(160,Math.min(p.width-32,p.height-16));
  dial.style.width=dial.style.height=D+"px";
  btn=D*.19;dialR=D/2-btn/2-8;
  for(var n=1;n<=12;n++){var s=btns[n].style;s.width=s.height=btn+"px";s.marginLeft=s.marginTop=(-btn/2)+"px";s.fontSize=(btn*.46)+"px";bpos[n].init=false}
}
window.addEventListener("resize",resize);

function getNode(i){
  if(!nodes[i]){
    var n;do{n=1+Math.floor(Math.random()*12)}while(n===lastN);lastN=n;
    var item=null;
    if(i>=nextItem){
      var r=Math.random();
      item=r<.25?"slow":r<.33?"shield":r<.47?"mh":r<.61?"mv":r<.73?"fog":r<.88?"rot":"blank";
      if(i<30&&item==="rot")item="slow";
      nextItem=i+6+Math.floor(Math.random()*4);
    }
    var tree=false;if(i>=nextTree){tree=true;item=null;nextTree=i+14+Math.floor(Math.random()*16)}
    var baby=!tree&&!item&&i>=8&&Math.random()<.08;
    nodes[i]={n:n,item:item,tree:tree,baby:baby,mango:!baby&&!tree&&!item&&i>=3&&Math.random()<.3,y:(Math.random()*2-1)*12};
  }
  return nodes[i];
}
function windowFor(){var b=dist<15?3.2-dist*.02:Math.max(.7,2.9*Math.pow(.972,dist-15));return fx.slow>0?b*1.7:b}

function start(){
  nodes={0:{n:0,item:null,y:0}};pos=0;score=0;camX=0;theta=0;vel=0;handY=0;swingFrom=0;swingP=1;lastN=0;nextItem=6;
  fx={slow:0,mh:0,mv:0,rot:0,fog:0,rom:0,blank:0};rotT=0;world=prevWorld=0;fade=0;fallY=0;spin=0;banner=null;
  for(var bi=1;bi<=12;bi++)btns[bi].classList.remove("ok","bad");
  nextTree=12+Math.floor(Math.random()*8);sleepM=0;shake=0;
  harpyOut=null;deathCause=null;runBest=SAVE.bestLianen||0;recordBroken=false;feverCharge=0;feverCool=feverCoolMax=15;runMode=false;jumpT=1;upT=1;runSigns=[];runMangos=[];runPhase="run";runAnchor=.3;graceT=0;nightDone=false;flipT0=null;$("game").classList.remove("crash");$("help").hidden=true;$("overlay").classList.remove("helpmode");
  dist=0;mult=1;fastRun=0;shield=0;fever=0;secondUsed=false;chase=null;nextChase=25+Math.floor(Math.random()*10);playT=0;weather=null;nextWeather=30+Math.random()*20;flashA=0;floats=[];bestMult=1;fastest=9;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();initMusic()}catch(e){}
  if(SAVE.armed.shield)shield=1+(SAVE.up.shield||0);if(SAVE.armed.slow)fx.slow=20;SAVE.armed={};persist();preview=false;$("panel").hidden=true;
  tMax=tLeft=windowFor();state="play";
  $("overlay").hidden=true;hud();$("world").textContent=WORLDS[0].name;
}
var fallY=0,fallV=0,spin=0,failMsg="",banner=null,fallT=0,dizzyT=0,flipT0=null,feverCharge=0,FEVER_MAX=8;
var fever=0,secondUsed=false,chase=null,nextChase=30,playT=0,weather=null,nextWeather=40,flashA=0,star=null;
function saved(text,color){mult=1;fastRun=0;hud();tMax=tLeft=windowFor();if(chase)chase.gap=Math.max(chase.gap,.45);
  banner={text:text,color:color,t:1.8,d:1.8};tone(520,.3,"sine",.15,260);vib(60)}
var deathCause=null,curHelp=null;
function over(msg,wrongN,noMark,cause){
  if(state!=="play")return;
  if(tut&&dist<3)return;
  if(fever>0){fever=0;saved("Fieber hat dich gerettet!","#f0a52a");return}
  if(shield){shield--;if(cause==="harpy")goalEv("shieldHarpy",1,true);saved("Schild gerettet!","#2f8fd6");return}
  if(SAVE.up.second&&!secondUsed){secondUsed=true;saved("Zweite Chance!","#b05ad6");return}
  deathCause=cause||["rot","mh","mv","blank","fog"].filter(function(k){return fx[k]>0})[0]||null;
  tone(420,.8,"triangle",.2,70);vib(250);
  fx.blank=0;if(!noMark)btns[getNode(pos+1).n].classList.add("ok");if(wrongN)btns[wrongN].classList.add("bad");
  state="fall";failMsg=msg;fallT=0;crashY=0;crashV=0;dust=[];$("game").classList.add("crash");
}
function showOver(){

  HATS.forEach(function(h){if(h[2]===SAVE.level)un=h[1]});
  banner={text:"Level "+SAVE.level+"!"+(un?" Neu: "+un:""),color:"#b05ad6",t:2.8,d:2.8};floatUp("+"+rw+" Mangos","#ff8a1f");jingle();persist();
}
function goalEv(type,val,add){
  ensureGoals();var all=true;
  SAVE.goals.list.forEach(function(g){
    if(g.type===type&&!g.done){
      g.prog=add?g.prog+val:Math.max(g.prog,val);
      if(g.prog>=g.target){g.prog=g.target;g.done=true;floatUp("Ziel geschafft!","#2fae6b");persist()}
    }
    if(!g.done)all=false;
  });
  if(all)levelUp();
}

/* ---------- Dial ---------- */
function layoutDial(dt){
  var rot=fx.rot>0?(rotT*12)%360:0;
  for(var n=1;n<=12;n++){
    var a=n*30;if(!runMode){if(fx.mh>0)a=-a;if(fx.mv>0)a=180-a;a+=rot}a=a*Math.PI/180;
    var tx=Math.sin(a)*dialR,ty=-Math.cos(a)*dialR,p=bpos[n];
    if(!p.init){p.x=tx;p.y=ty;p.init=true}
    else{var k=Math.min(1,dt*14);p.x+=(tx-p.x)*k;p.y+=(ty-p.y)*k}
    btns[n].style.transform="translate("+p.x.toFixed(1)+"px,"+p.y.toFixed(1)+"px)";
    var lab=!runMode&&fx.blank>0&&hidden[n]?"":fx.rom>0?ROM[n]:String(n);
    if(btns[n].textContent!==lab){btns[n].textContent=lab;btns[n].style.fontSize=(btn*(fx.rom>0?.32:.46))+"px"}
  }
  var sl=state==="sleep";if($("wake").hidden===sl){$("wake").hidden=!sl;center.hidden=sl}
  if(sl){$("wake").style.setProperty("--p",Math.round(sleepM*100)+"%");var wtxt="Aufwecken! "+Math.max(1,Math.ceil(sleepT));if($("wake").textContent!==wtxt)$("wake").textContent=wtxt}
  var html=shield?'<span class="chip good">Schild aktiv</span>':"";
  if(chase)html+='<span class="chip bad">Harpyie!</span>';
  if(dial.classList.contains("gold")!==runMode)dial.classList.toggle("gold",runMode);
  if(runMode&&fever>0)html+='<span class="chip good">Mango-Rausch '+Math.ceil(fever)+" s</span>";
  if(!runMode)for(var key in ITEMS){if(fx[key]>0){var it=ITEMS[key];
    html+='<span class="chip '+(it.good?"good":"bad")+'">'+it.label+" "+Math.ceil(fx[key])+" s</span>"}}
  var top=state==="ready"?'<span class="hint">Uhr = Steuerung</span>':'<div class="cscore">'+score+(mult>1?'<span class="cmult'+(fever>0?" fever":"")+'">x'+mult+"</span>":"")+"</div>";
  if(state==="play"&&tut&&dist<3)top+='<span class="hint">Tippe die '+getNode(pos+1).n+"</span>";
  if(state!=="play")html="";
  html=top+html;
  if(center.innerHTML!==html)center.innerHTML=html;
}

function sh(on,oy){ctx.shadowColor=on?"rgba(20,30,20,.3)":"transparent";ctx.shadowBlur=on?9*u:0;ctx.shadowOffsetY=on?oy*u:0}
function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
var KEYS=["top","bot","sun","far","mid","near","fg"],drift=0;
WORLDS.forEach(function(w){w.c={};KEYS.forEach(function(k){w.c[k]=rgb(w[k])})});
/* Welten liegen nebeneinander im Raum: jede Bildspalte kennt ihre Welt, an den Grenzen wird gemischt */
function wAt(x,k){
  var v=Math.max(0,(camX+(x-W/2)*k)/(WORLD_LEN*S)),i=Math.floor(v),f=v-i,t=f<.72?0:(f-.72)/.28;t=t*t*(3-2*t);
  return {a:i%4,b:(i+1)%4,t:t};
}
function wt(i,x,k){var w=wAt(x,k);return (w.a===i?1-w.t:0)+(w.b===i?w.t:0)}
function col(key,x,k,al){
  var w=wAt(x,k),A=WORLDS[w.a].c[key],B=WORLDS[w.b].c[key],t=w.t;
  return "rgba("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+","+(al==null?1:al)+")";
}
function grad(key,k){var g=ctx.createLinearGradient(0,0,W,0);for(var i=0;i<=8;i++)g.addColorStop(i/8,col(key,W*i/8,k));return g}
function layer(key,par,k,base,amp,f,sawAmt){
  var bx=camX+drift;
  ctx.fillStyle=grad(key,k);ctx.beginPath();ctx.moveTo(0,H);
  for(var x=0;x<=W+8;x+=8){
    var q=(x+bx*par)*f,v=(Math.sin(q)+Math.sin(q*.47+1.3)*.6)/1.6;
    if(sawAmt){var w=wAt(x,k),sw=(WORLDS[w.a].saw*(1-w.t)+WORLDS[w.b].saw*w.t)*sawAmt;
      if(sw>0){var tri=Math.abs(((q/2.2)%2+2)%2-1)*2-1;v=v*(1-sw)+tri*sw*1.5}}
    ctx.lineTo(x,base-amp*(v*.5+.5));
  }
  ctx.lineTo(W,H);ctx.closePath();sh(1,-3);ctx.fill();sh(0);
}
function paperTree(x,bottom){
  ctx.fillStyle="#6b4a2f";sh(1,0);ctx.fillRect(x-15*u,0,30*u,bottom);sh(0);
  ctx.fillStyle="#57391f";ctx.fillRect(x+6*u,0,9*u,bottom);
  ctx.strokeStyle="rgba(40,25,10,.35)";ctx.lineWidth=1.6*u;ctx.lineCap="round";
  for(var yy=24*u,k=0;yy<bottom;yy+=34*u,k++){ctx.beginPath();ctx.arc(x+(k%2?3:-5)*u,yy,6*u,Math.PI*.2,Math.PI*.8);ctx.stroke()}

}

  if(!runMode)camX+=((gA.x+gB.x)/2-camX)*Math.min(1,dt*9);
  if(upT<1)upT+=dt;
  vel+=(-34*theta-2.4*vel)*dt;theta+=vel*dt;
  if(fade>0)fade=Math.max(0,fade-dt);
  if(crashMode())drawCrash(dt);else{
  drawBg();drawNight(dt);
  ctx.save();if(shake>.02)ctx.translate(Math.sin(time*70)*shake*6*u,0);
  if(runMode)drawRunWorld();drawVines();drawSloth();drawHarpy();ctx.restore();
  if(state==="sleep"){ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
    for(var z=0;z<3;z++){var zp=(time*.5+z/3)%1;ctx.globalAlpha=1-zp;ctx.font="800 "+Math.round((16+zp*24)*u)+"px 'Baloo 2',sans-serif";
      ctx.fillText("Z",W/2-(30+zp*34)*u,H*.44+(30-zp*60)*u)}ctx.globalAlpha=1}
  if(!runMode)drawFg();drawWeather(dt);drawChaseBar();}
  drawGrain();drawFloats(dt);drawBanner();layoutDial(dt);
  var fr=$("fring");var cooling=fever<=0&&feverCool>0;fr.style.setProperty("--f",Math.round(Math.min(1,fever>0?fever/FEVER_MAX:cooling?1-feverCool/feverCoolMax:feverCharge)*100)+"%");if(fr.classList.contains("on")!==(fever>0))fr.classList.toggle("on",fever>0);if(fr.classList.contains("cool")!==cooling)fr.classList.toggle("cool",cooling);
  dial.style.boxShadow="inset 0 0 0 6px "+((chase||fx.mh>0||fx.mv>0||fx.rot>0)?"#e8503a":fx.slow>0?"#3fbf8f":"#2f8f5f")+",0 10px 22px rgba(0,0,0,.35)";
  requestAnimationFrame(frame);
}
resize();handY=nodeY(0);$("mango").textContent=mango;
requestAnimationFrame(frame);
})();
